alias: Bluelab alarm active
description: ""
triggers:
  - trigger: state
    entity_id:
      - sensor.bluelab_alarm_summary_4q3f
      - sensor.bluelab_alarm_summary_52rf
conditions:
  - condition: template
    value_template: "{{ trigger.to_state.state != 'No active alarms' }}"
actions:
  - action: notify.farm_urban
    metadata: {}
    data:
      message: >-
        {{ trigger.to_state.name }}: {{ trigger.to_state.state }}
      target: "#cryptfarm"
mode: single
